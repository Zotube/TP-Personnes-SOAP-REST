server.port=8081
spring.application.name=soap-service

# Base H2 en mémoire (aucune base externe)
spring.datasource.url=jdbc:h2:mem:personnes;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Console H2 (facultative, utile pour vérifier les données)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.org.springframework.ws=INFO
